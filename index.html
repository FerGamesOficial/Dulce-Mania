<meta name="theme-color" content="#30205c">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg1:#17132b;
    --bg2:#30205c;
    --panel:rgba(255,255,255,.12);
    --text:#fff;
    --accent:#ffcc33;
}

body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 20% 10%,#6238a8 0,transparent 30%),
        radial-gradient(circle at 80% 90%,#a82d73 0,transparent 30%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

.app{
    width:min(100%,650px);
    padding:18px;
}

.logo{
    text-align:center;
    margin-bottom:14px;
}

.logo h1{
    margin:0;
    font-size:clamp(35px,8vw,60px);
    font-weight:900;
    letter-spacing:-3px;
    color:#fff;
    text-shadow:
        0 5px 0 #d7376b,
        0 10px 20px rgba(0,0,0,.35);
}

.logo span{
    display:block;
    margin-top:4px;
    font-size:12px;
    letter-spacing:4px;
    opacity:.7;
}

.hud{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-bottom:12px;
}

.stat{
    background:var(--panel);
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px;
    padding:10px 5px;
    text-align:center;
    backdrop-filter:blur(12px);
    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.stat small{
    display:block;
    font-size:10px;
    opacity:.65;

}

}

.goal{
    background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.07));

    justify-content:space-between;

    color:#ffe27a;
}

#board{
    width:min(92vw,560px);
    aspect-ratio:1;
    margin:auto;
    padding:7px;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:5px;
    border-radius:22px;
    background:rgba(0,0,0,.27);

        inset 0 2px 8px rgba(255,255,255,.08),

.cell{

.cell:hover{
    background:rgba(255,255,255,.12);
}

.cell.selected{
    transform:scale(.88);
    background:rgba(255,255,255,.25);

.candy{
    width:78%;
    height:78%;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:clamp(22px,6vw,40px);
    filter:drop-shadow(0 5px 4px rgba(0,0,0,.28));
    pointer-events:none;
}

/* La animación de aparición solo se aplica a dulces nuevos (antes se repetía en cada render) */
.candy.pop{
    animation:spawn .18s ease-out;
}

.candy.special{
    animation:specialPulse .8s infinite alternate;
}

.candy.special.pop{
    animation:spawn .18s ease-out, specialPulse .8s .18s infinite alternate;
}

/* Insignia del dulce especial: conserva el color del dulce y muestra su poder */
.candy.special::after{
    content:attr(data-badge);
    position:absolute;
    right:-8%;
    bottom:-10%;
    font-size:.5em;
    line-height:1;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
}

@keyframes spawn{
    from{transform:scale(.2) rotate(-20deg);opacity:0}
    to{transform:scale(1) rotate(0);opacity:1}
}

/* scale() no es válido dentro de filter: se separó en transform + filter */
@keyframes specialPulse{
    from{transform:scale(.95);filter:drop-shadow(0 0 2px white)}
    to{transform:scale(1.05);filter:drop-shadow(0 0 12px #ffe27a)}
}

.controls{
    display:flex;

}

button{

}

}

.primary{
    background:linear-gradient(135deg,#ff4f87,#ff8c35);

@keyframes combo{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-8deg)}

</style>
</head>

<body>

<div class="app">

    <div class="logo">
        <h1>🍬 DULCE MANIA</h1>
        <span>MATCH • COMBINA • GANA</span>
    </div>

    <div class="hud">
        <div class="stat">
            <small>Puntuación</small>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <small>Movimientos</small>
            <strong id="moves">30</strong>
        </div>

        <div class="stat">
            <small>Combo</small>
            <strong id="comboCount">x1</strong>
        </div>
    </div>

    <div class="goal">
        <span>🎯 Objetivo</span>
        <b><span id="goalText">5,000</span> puntos</b>
    </div>

    <div id="board"></div>

    <div class="message" id="message"></div>

    <div class="controls">
        <button class="primary" id="newGame">🔄 Nueva partida</button>
        <button id="shuffle">🔀 Mezclar</button>
    </div>

    <div class="footer">
        Dulce Mania v1.0 • Juego HTML/CSS/JS
    </div>
</div>

<div class="combo" id="comboPopup">¡COMBO!</div>

<div class="overlay" id="overlay" style="display:none">
    <div class="modal">
        <div class="big" id="resultIcon">🏆</div>
        <h2 id="resultTitle">¡Nivel completado!</h2>
        <p id="resultText">Has conseguido superar el objetivo.</p>

        <div class="result">
            <div>
                <small>PUNTUACIÓN</small>
                <b id="finalScore">0</b>
            </div>
            <div>
                <small>MOVIMIENTOS</small>
                <b id="finalMoves">0</b>
            </div>
        </div>

        <button class="primary" id="playAgain">Jugar otra vez</button>
    </div>
</div>

<script>

const SIZE = 8;

// 🫐 (arándano) se cambió por 🍒: el arándano es de 2020 y en móviles/PC antiguos sale como un cuadro vacío
const CANDIES = [
    "🍓",
    "🍋",
    "🍇",
    "🍊",
    "🍒",
    "🍏",
    "🍬"
];

let board = [];
let selected = null;
let score = 0;
let moves = 30;
let comboLevel = 1;
let busy = false;
let lastSwapTarget = null;
let gameToken = 0;          // invalida animaciones pendientes al empezar otra partida
let gestureActive = false;
const fresh = new Set();    // celdas con dulces nuevos (solo esas animan al aparecer)

const GOAL = 5000;

const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const movesEl = document.getElementById("moves");
const comboEl = document.getElementById("comboCount");
const messageEl = document.getElementById("message");
const overlay = document.getElementById("overlay");

// -------------------------------------
// CREAR TABLERO
// -------------------------------------

function randomCandy(){
    return CANDIES[Math.floor(Math.random()*CANDIES.length)];
}

function markAllFresh(){
    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++) fresh.add(`${r},${c}`);
    }
}

function fillRandomNoMatches(){
    board = [];

    for(let r=0;r<SIZE;r++){
        board[r] = [];

        for(let c=0;c<SIZE;c++){
            let candy;

            do{
                candy = randomCandy();
            }
            while(
                (c >= 2 && sameCandy(board[r][c-1], candy) && sameCandy(board[r][c-2], candy)) ||
                (r >= 2 && sameCandy(board[r-1][c], candy) && sameCandy(board[r-2][c], candy))
            );

            board[r][c] = candy;
        }
    }
}

function createBoard(){
    // Garantiza que el tablero inicial tenga al menos un movimiento posible
    do{
        fillRandomNoMatches();
    }while(!hasValidMove());

    markAllFresh();
    render();
}

// -------------------------------------
// RENDER
// -------------------------------------

function render(){
    boardEl.innerHTML = "";

    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            const cell = document.createElement("div");
            cell.className = "cell";

            if(selected && selected.r === r && selected.c === c){
                cell.classList.add("selected");
            }

            const candy = board[r][c];

            if(candy){
                const el = document.createElement("div");
                el.className = "candy";

                if(fresh.has(`${r},${c}`)) el.classList.add("pop");

                if(typeof candy === "object" && candy.special){
                    el.classList.add("special");
                    el.textContent = candy.value;
                    el.dataset.badge = candy.type === "row" ? "⚡" : "💥";
                }
                else{
                    el.textContent = candy;
                }

                cell.appendChild(el);
            }

            cell.addEventListener("pointerdown", (e) => handlePointerDown(e, r, c));
            boardEl.appendChild(cell);
        }
    }

    fresh.clear();
    updateHUD();
}

// -------------------------------------
// CONTROLES POINTER / TOUCH
// -------------------------------------

function handlePointerDown(e, r, c){
    if(busy || moves <= 0 || gestureActive) return;

    gestureActive = true;
    const startX = e.clientX;
    const startY = e.clientY;
    const cellSize = boardEl.clientWidth / SIZE;
    const threshold = Math.max(12, cellSize * 0.4);

    const cleanup = () => {
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onCancel);
        gestureActive = false;
    };

    // Si el sistema cancela el gesto (scroll, llamada, etc.) se limpia el listener.
    // Antes quedaba colgado y disparaba un movimiento fantasma en el siguiente toque.
    const onCancel = () => cleanup();

    const onUp = (upEv) => {
        cleanup();
        if(busy || moves <= 0) return;

        const dx = upEv.clientX - startX;
        const dy = upEv.clientY - startY;

        if(Math.abs(dx) > threshold || Math.abs(dy) > threshold){
            let r2 = r;
            let c2 = c;

            if(Math.abs(dx) > Math.abs(dy)){
                c2 += dx > 0 ? 1 : -1;
            } else {
                r2 += dy > 0 ? 1 : -1;
            }

            if(r2 >= 0 && r2 < SIZE && c2 >= 0 && c2 < SIZE){
                selected = null;
                swap(r, c, r2, c2);
            }
        } else {
            selectCell(r, c);
        }
    };

    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onCancel);
}

function selectCell(r,c){
    if(busy || moves <= 0) return;

    if(!selected){
        selected = {r,c};
        render();
        return;
    }

    const r1 = selected.r;
    const c1 = selected.c;

    if(r1 === r && c1 === c){
        selected = null;
        render();
        return;
    }

    if(isAdjacent(r1,c1,r,c)){
        swap(r1,c1,r,c);
    }else{
        selected = {r,c};
        render();
    }
}

function isAdjacent(r1,c1,r2,c2){
    return Math.abs(r1-r2)+Math.abs(c1-c2) === 1;
}

// -------------------------------------
// INTERCAMBIO
// -------------------------------------

function wait(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

// Espera y devuelve false si mientras tanto se empezó otra partida
async function pause(ms, token){
    await wait(ms);
    return token === gameToken;
}

async function swap(r1,c1,r2,c2){
    const token = gameToken;
    busy = true;
    selected = null;
    lastSwapTarget = {r: r2, c: c2};

    [board[r1][c1],board[r2][c2]] = [board[r2][c2],board[r1][c1]];
    render();

    if(!(await pause(130, token))) return;

    let matchData = findMatchGroups();

    if(matchData.cells.length === 0){
        [board[r1][c1],board[r2][c2]] = [board[r2][c2],board[r1][c1]];
        render();

        messageEl.textContent = "❌ Ese movimiento no forma combinación";
        if(!(await pause(500, token))) return;
        messageEl.textContent = "";

        busy = false;
        lastSwapTarget = null;
        return;
    }

    moves--;

    if(!(await resolveBoard(matchData, token))) return;

    lastSwapTarget = null;

    // Si no queda ningún movimiento posible se mezcla solo (sin gastar movimiento)
    if(score < GOAL && moves > 0 && !hasValidMove()){
        messageEl.textContent = "🔀 Sin movimientos: mezclando...";
        if(!(await pause(700, token))) return;
        shuffleCandies();
        markAllFresh();
        render();
        if(!(await pause(500, token))) return;
        messageEl.textContent = "";
    }

    busy = false;
    checkGame();
}

// -------------------------------------
// BUSCAR COMBINACIONES Y GRUPOS
// -------------------------------------

function findMatchGroups(){
    const foundCells = new Set();
    const groups = [];

    // Horizontales
    for(let r=0;r<SIZE;r++){
        let start=0;
        for(let c=1;c<=SIZE;c++){
            const same = c<SIZE && sameCandy(board[r][c], board[r][start]);
            if(!same){
                const length = c-start;
                if(length >= 3){
                    const group = [];
                    for(let x=start;x<c;x++){
                        foundCells.add(`${r},${x}`);
                        group.push({r, c: x});
                    }
                    groups.push({type: 'horizontal', length, cells: group, val: getCandyVal(board[r][start])});
                }
                start=c;
            }
        }
    }

    // Verticales
    for(let c=0;c<SIZE;c++){
        let start=0;
        for(let r=1;r<=SIZE;r++){
            const same = r<SIZE && sameCandy(board[r][c], board[start][c]);
            if(!same){
                const length=r-start;
                if(length>=3){
                    const group = [];
                    for(let x=start;x<r;x++){
                        foundCells.add(`${x},${c}`);
                        group.push({r: x, c});
                    }
                    groups.push({type: 'vertical', length, cells: group, val: getCandyVal(board[start][c])});
                }
                start=r;
            }
        }
    }

    const cells = [...foundCells].map(x=>{
        const [r,c]=x.split(",").map(Number);
        return {r,c};
    });

    return { cells, groups };
}

function sameCandy(a,b){
    if(!a || !b) return false;
    let valA = typeof a === "object" ? a.value : a;
    let valB = typeof b === "object" ? b.value : b;
    return valA === valB;
}

function getCandyVal(a){
    if(!a) return null;
    return typeof a === "object" ? a.value : a;
}

// ¿Existe al menos un intercambio que forme combinación?
function hasValidMove(){
    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            for(const [dr,dc] of [[0,1],[1,0]]){
                const r2=r+dr, c2=c+dc;
                if(r2>=SIZE || c2>=SIZE) continue;

                [board[r][c],board[r2][c2]] = [board[r2][c2],board[r][c]];
                const ok = findMatchGroups().cells.length > 0;
                [board[r][c],board[r2][c2]] = [board[r2][c2],board[r][c]];

                if(ok) return true;
            }
        }
    }
    return false;
}

// -------------------------------------
// RESOLVER TABLERO Y DULCES ESPECIALES
// -------------------------------------

async function resolveBoard(matchData, token){
    let chain=0;

    while(matchData.cells.length){
        chain++;
        comboLevel = Math.min(chain,9);
        showCombo(chain);

        // Procesar creaciones de dulces especiales antes de eliminar
        let specialToSpawn = [];

        matchData.groups.forEach(g => {
            if(g.length >= 4){
                let targetCell = g.cells.find(cell => lastSwapTarget && cell.r === lastSwapTarget.r && cell.c === lastSwapTarget.c) || g.cells[1];
                let specialType = g.length >= 5 ? "bomb" : "row";
                specialToSpawn.push({
                    r: targetCell.r,
                    c: targetCell.c,
                    candy: { special: true, type: specialType, value: g.val }
                });
            }
        });

        // Expandir eliminaciones si se activa una pieza especial existente
        let finalExplosionCells = new Set();
        matchData.cells.forEach(p => finalExplosionCells.add(`${p.r},${p.c}`));

        matchData.cells.forEach(p => {
            let item = board[p.r][p.c];
            if(item && typeof item === "object" && item.special){
                if(item.type === "row"){
                    for(let i=0; i<SIZE; i++) finalExplosionCells.add(`${p.r},${i}`);
                } else if(item.type === "bomb"){
                    for(let r=Math.max(0, p.r-1); r<=Math.min(SIZE-1, p.r+1); r++){
                        for(let c=Math.max(0, p.c-1); c<=Math.min(SIZE-1, p.c+1); c++){
                            finalExplosionCells.add(`${r},${c}`);
                        }
                    }
                }
            }
        });

        let explodedList = [...finalExplosionCells].map(x => {
            const [r,c] = x.split(",").map(Number);
            return {r,c};
        });

        addScore(explodedList.length * 100 * comboLevel);
        removeMatches(explodedList);

        // Colocar especiales generados
        specialToSpawn.forEach(s => {
            board[s.r][s.c] = s.candy;
            fresh.add(`${s.r},${s.c}`);
        });

        render();
        if(!(await pause(260, token))) return false;

        applyGravity();
        render();
        if(!(await pause(180, token))) return false;

        fillEmpty();
        render();
        if(!(await pause(280, token))) return false;

        matchData = findMatchGroups();
    }

    comboLevel=1;
    comboEl.textContent="x1";
    return true;
}

function removeMatches(matches){
    for(const {r,c} of matches){
        board[r][c]=null;
    }
}

function applyGravity(){
    for(let c=0;c<SIZE;c++){
        let write=SIZE-1;

        for(let r=SIZE-1;r>=0;r--){
            if(board[r][c]){
                board[write][c]=board[r][c];
                if(write!==r){
                    board[r][c]=null;
                }
                write--;
            }
        }

        while(write>=0){
            board[write][c]=null;
            write--;
        }
    }
}

// ¿El dulce colocado en (r,c) completa una línea de 3 o más?
function makesMatchAt(r,c){
    const v = getCandyVal(board[r][c]);
    const run = (dr,dc)=>{
        let n=0, rr=r+dr, cc=c+dc;
        while(rr>=0 && rr<SIZE && cc>=0 && cc<SIZE && getCandyVal(board[rr][cc])===v){
            n++; rr+=dr; cc+=dc;
        }
        return n;
    };
    return run(0,1)+run(0,-1)+1 >= 3 || run(1,0)+run(-1,0)+1 >= 3;
}

// Antes, tras rellenar se volvían a sortear TODAS las celdas con combinación, incluso dulces
// ya existentes y especiales (se borraban sin avisar). Ahora solo se eligen bien los dulces nuevos.
function fillEmpty(){
    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            if(!board[r][c]){
                let tries=0;
                do{
                    board[r][c]=randomCandy();
                    tries++;
                }while(tries<12 && makesMatchAt(r,c));
                fresh.add(`${r},${c}`);
            }
        }
    }
}

// -------------------------------------
// PUNTUACIÓN Y HUD
// -------------------------------------

function addScore(points){
    score+=points;
    updateHUD();
}

function updateHUD(){
    scoreEl.textContent=score.toLocaleString();
    movesEl.textContent=moves;
    comboEl.textContent="x"+comboLevel;
    document.getElementById("goalText").textContent=GOAL.toLocaleString();
}

// -------------------------------------
// COMBO POPUP
// -------------------------------------

function showCombo(level){
    const popup=document.getElementById("comboPopup");

    popup.textContent =
        level === 1
        ? "¡DULCE!"
        : level === 2
        ? "¡COMBO x2!"
        : level === 3
        ? "¡COMBO x3!"
        : level === 4
        ? "¡INCREÍBLE!"
        : "🔥 ¡MEGA COMBO!";

    popup.classList.remove("show");
    void popup.offsetWidth;
    popup.classList.add("show");
}

// -------------------------------------
// MEZCLAR
// -------------------------------------

// Reordena los dulces que ya hay (conserva los especiales) hasta lograr un tablero
// sin combinaciones hechas y con al menos un movimiento posible.
function shuffleCandies(){
    const items=[];
    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++) items.push(board[r][c]);
    }

    for(let attempt=0;attempt<300;attempt++){
        for(let i=items.length-1;i>0;i--){
            const j=Math.floor(Math.random()*(i+1));
            [items[i],items[j]]=[items[j],items[i]];
        }

        let k=0;
        for(let r=0;r<SIZE;r++){
            for(let c=0;c<SIZE;c++) board[r][c]=items[k++];
        }

        if(findMatchGroups().cells.length===0 && hasValidMove()) return;
    }

    // Último recurso: tablero nuevo
    do{
        fillRandomNoMatches();
    }while(!hasValidMove());
}

async function shuffleBoard(){
    if(busy || moves<=0) return;

    const token = gameToken;
    busy=true;
    selected=null;
    moves--;

    messageEl.textContent="🔀 ¡Tablero mezclado!";

    shuffleCandies();
    markAllFresh();
    render();

    if(!(await pause(500, token))) return;

    messageEl.textContent="";
    busy=false;
    checkGame();
}

// -------------------------------------
// FIN DEL JUEGO
// -------------------------------------

function checkGame(){
    if(score>=GOAL){
        endGame(true);
        return;
    }

    if(moves<=0){
        endGame(false);
    }
}

function endGame(win){
    overlay.style.display="flex";

    document.getElementById("resultIcon").textContent =
        win ? "🏆" : "💔";

    document.getElementById("resultTitle").textContent =
        win ? "¡Nivel completado!" : "¡Se acabaron los movimientos!";

    document.getElementById("resultText").textContent =
        win
        ? "¡Has conseguido alcanzar el objetivo!"
        : "No pasa nada. ¡Puedes intentarlo otra vez!";

    document.getElementById("finalScore").textContent =
        score.toLocaleString();

    document.getElementById("finalMoves").textContent =
        moves;
}

// -------------------------------------
// NUEVA PARTIDA
// -------------------------------------

function newGame(){
    gameToken++;   // cancela cualquier animación o cascada que siga en curso
    overlay.style.display="none";

    score=0;
    moves=30;
    comboLevel=1;
    selected=null;
    busy=false;
    lastSwapTarget=null;
    gestureActive=false;

    messageEl.textContent="";
    createBoard();
}

// -------------------------------------
// LISTENERS
// -------------------------------------

document.getElementById("newGame").addEventListener("click",newGame);
document.getElementById("shuffle").addEventListener("click",shuffleBoard);
document.getElementById("playAgain").addEventListener("click",newGame);

// -------------------------------------
// INICIO
// -------------------------------------

createBoard();

</script>

</body>
</html>
